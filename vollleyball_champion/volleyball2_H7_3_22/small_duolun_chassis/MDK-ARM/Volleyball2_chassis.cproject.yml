project:
  packs:
    - pack: ARM::CMSIS@^5.9.0
    - pack: Keil::STM32G4xx_DFP@^2.0.0
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for Volleyball2_chassis
      processor:
        fpu: sp
      add-path:
        - ../Core/Inc
        - ../Drivers/STM32G4xx_HAL_Driver/Inc
        - ../Drivers/STM32G4xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32G4xx/Include
        - ../Drivers/CMSIS/Include
        - ../Motor_control
        - ../BSP
        - ../chassis_task
        - ../control
        - ../motor_ramp
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32G474xx
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++03
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: stm32g474xx_flash.sct
  groups:
    - group: Application/MDK-ARM
      files:
        - file: startup_stm32g474xx.s
          misc:
            - ASM:
                - -masm=auto
                - -x assembler
    - group: Application/User/Core
      files:
        - file: ../Core/Src/main.c
        - file: ../Core/Src/gpio.c
        - file: ../Core/Src/dma.c
        - file: ../Core/Src/fdcan.c
        - file: ../Core/Src/usart.c
        - file: ../Core/Src/stm32g4xx_it.c
        - file: ../Core/Src/stm32g4xx_hal_msp.c
    - group: Drivers/STM32G4xx_HAL_Driver
      files:
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_fdcan.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_rcc.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_rcc_ex.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_flash.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_flash_ex.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_flash_ramfunc.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_gpio.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_exti.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_dma.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_dma_ex.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_pwr.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_pwr_ex.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_cortex.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_uart.c
        - file: ../Drivers/STM32G4xx_HAL_Driver/Src/stm32g4xx_hal_uart_ex.c
    - group: Drivers/CMSIS
      files:
        - file: ../Core/Src/system_stm32g4xx.c
    - group: motor
      files:
        - file: ../Motor_control/vesc.c
        - file: ../Motor_control/vesc_rx.c
        - file: ../Motor_control/pid.c
        - file: ../Motor_control/pid.h
        - file: ../Motor_control/vesc.h
        - file: ../Motor_control/vesc_rx.h
        - file: ../Motor_control/dji_motor.c
        - file: ../Motor_control/dji_motor.h
    - group: chassis_task
      files:
        - file: ../chassis_task/chassis_task.c
        - file: ../chassis_task/chassis_task.h
    - group: fdcan_bsp
      files:
        - file: ../BSP/fdcan_bsp.c
        - file: ../BSP/fdcan_bsp.h
    - group: control
      files:
        - file: ../control/control.c
        - file: ../control/control.h
    - group: motor_ramp
      files:
        - file: ../motor_ramp/motor_ramp.c
        - file: ../motor_ramp/motor_ramp.h
  components:
    - component: ARM::CMSIS:CORE
