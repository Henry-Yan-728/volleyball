source [find interface/cmsis-dap.cfg]
transport select swd
set WORKAREASIZE 0x8000
source [find target/stm32h7x.cfg]

# Some CMSIS-DAP probes are unreliable when OpenOCD stages the H7 flash
# algorithm in DTCM (0x20000000). Use AXI SRAM instead.
adapter speed 400
stm32h7x.cpu0 configure -work-area-phys 0x24000000 -work-area-size $WORKAREASIZE -work-area-backup 0
